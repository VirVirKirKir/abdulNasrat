name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          brew install xcodegen
          cd AlertOrenburg
          shopt -s nullglob
          for f in Sources/Resources/Sounds/*.mp3; do
            afconvert -f caff -d LEI16@44100 -c 1 "$f" "${f%.mp3}.caf" || true
          done
          xcodegen generate
          xcodebuild -project AlertOrenburg.xcodeproj -scheme AlertOrenburg \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p ../out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app ../out/Payload/
          cd ../out
          zip -qry app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AlertOrenburg-ipa
          path: out/app.ipa
